<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#fff}
#sig{width:600px;box-sizing:border-box;padding:18px 20px;display:flex;align-items:center;gap:20px;font-family:'Plus Jakarta Sans',sans-serif;color:#0A0D16;background:#fff}
.logo{width:72px;height:72px;flex-shrink:0}
.bar{width:2px;align-self:stretch;background:#1B4DFF;border-radius:2px}
.name{font-size:22px;font-weight:800;letter-spacing:-0.02em;line-height:1.1}
.role{font-size:14px;font-weight:600;color:#6B7382;margin-top:3px}
.role b{color:#1B4DFF}
.contact{margin-top:10px;font-size:13.5px;font-weight:600;color:#333A49;display:flex;gap:10px;align-items:center;white-space:nowrap}
.sep{color:#C3C8D3}
.web{color:#1B4DFF;font-weight:800}
.tag{margin-top:7px;font-size:12px;font-weight:500;color:#6B7382;display:flex;align-items:center;gap:7px}
.stars{color:#FBBC04;letter-spacing:1px;font-size:13px}
</style></head><body>
<div id="sig">
  <img class="logo" src="../logo/svg/reviu-monogramme-cobalt.svg">
  <div class="bar"></div>
  <div>
    <div class="name">Yoan Oliveira</div>
    <div class="role">Fondateur · <b>reviu</b></div>
    <div class="contact"><span>07 81 98 30 42</span><span class="sep">|</span><span>contact@reviu.fr</span><span class="sep">|</span><span class="web">reviu.fr</span></div>
    <div class="tag"><span class="stars">★★★★★</span>Plus d’avis clients, directement depuis votre comptoir.</div>
  </div>
</div></body></html>
